<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0e" />
    <!-- Тема применяется до загрузки приложения, чтобы не было «вспышки»: по умолчанию тёмная,
         светлую или «как в системе» пользователь выбирает сам в профиле. -->
    <script>
      try {
        var t = localStorage.getItem('ik_theme')
        var dark = t === 'light' ? false : t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : true
        if (dark) document.documentElement.classList.add('dark')
        else document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
      } catch (e) { document.documentElement.classList.add('dark') }
    </script>
    <style>html{background:#fff}html.dark{background:#0b0b0e}</style>
    <title>Invoice Keeper — регулярные платежи без просрочек</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16'/%3E%3Crect x='10' y='8' width='12' height='16' rx='3' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M13.5 13h5M13.5 17h3' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
